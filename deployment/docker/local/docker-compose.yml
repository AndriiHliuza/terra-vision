# <<< SERVICES >>>
services:

    # <<<<<<<<<<<< APPLICATION services >>>>>>>>>>>>

    # ------------ Mongo ------------ 
    terra-vision__mongo:
        image: mongo:8.2.4
        container_name: terra-vision__mongo
        restart: unless-stopped
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${TERRA_VISION__MONGO__ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${TERRA_VISION__MONGO__ROOT_PASSWORD}
        volumes:
            - terra-vision__mongo__db-volume:/data/db
            - terra-vision__mongo__configdb-volume:/data/configdb
            - ./mongo/initdb:/docker-entrypoint-initdb.d:ro
        networks:
            - terra-vision-network


    # ------------ Redis ------------
    terra-vision__redis:
        image: redis:8.2.4
        container_name: terra-vision__redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --requirepass ${TERRA_VISION__REDIS__PASSWORD}
        volumes:
            - terra-vision__redis__data-volume:/data
        networks:
            - terra-vision-network
    

    # ------------ Postgres ------------
    terra-vision__postgres:
        image: postgres:18.2
        container_name: terra-vision__postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${TERRA_VISION__POSTGRES__USER}
            POSTGRES_PASSWORD: ${TERRA_VISION__POSTGRES__PASSWORD}
            POSTGRES_DB: ${TERRA_VISION__POSTGRES__DB} # default db
        ports:
            - '5432:5432'
        volumes:
            - terra-vision__postgres__volume:/var/lib/postgresql
            - ./postgresql/initdb:/docker-entrypoint-initdb.d:ro
        networks:
            - terra-vision-network


    # ------------ Minio ------------
    terra-vision__minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: terra-vision__minio
        restart: unless-stopped
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${TERRA_VISION__MINIO__ROOT_USER}
            MINIO_ROOT_PASSWORD: ${TERRA_VISION__MINIO__ROOT_PASSWORD}
        volumes:
            - terra-vision__minio__data-volume:/data
        command: server /data --console-address ":9001"
        networks:
            - terra-vision-network




    # <<<<<<<<<<<< DEV TOOLS services >>>>>>>>>>>>

    # ------------ Mongo Express ------------
    terra-vision__dev-tools__mongo-express:
        image: mongo-express:1.0.2
        container_name: terra-vision__dev-tools__mongo-express
        restart: unless-stopped
        ports:
            - 8081:8081
        environment:
            ME_CONFIG_MONGODB_SERVER: terra-vision__mongo
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${TERRA_VISION__MONGO__ROOT_USERNAME}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${TERRA_VISION__MONGO__ROOT_PASSWORD}
            ME_CONFIG_BASICAUTH_ENABLED: true
            ME_CONFIG_BASICAUTH_USERNAME: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
            ME_CONFIG_BASICAUTH_PASSWORD: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
        networks:
            - terra-vision-network
  

    # ------------ Redis Insight ------------
    terra-vision__dev-tools__redis-insight:
        image: redis/redisinsight:3.0
        container_name: terra-vision__dev-tools__redis-insight
        restart: unless-stopped
        ports:
            - "5540:5540"
        volumes:
            - terra-vision__dev-tools__redis-insight__data-volume:/data
        networks:
            - terra-vision-network
    

    # ------------ MailPit ------------
    terra-vision__dev-tools__mailpit:
        image: axllent/mailpit:v1.29
        container_name: terra-vision__dev-tools__mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"  # SMTP port
            - "8025:8025"  # Web UI port
        networks:
            - terra-vision-network



# <<< NETWORKS >>>
networks:
    terra-vision-network:
        driver: bridge
        name: terra-vision-network



# <<< VOLUMES >>>
volumes:

    # <<<<<<<<<<<< APPLICATION volumes >>>>>>>>>>>>

    # ------------ Mongo ------------
    terra-vision__mongo__db-volume:
        name: terra-vision__mongo__db-volume


    terra-vision__mongo__configdb-volume:
        name: terra-vision__mongo__configdb-volume
    

    # ------------ Redis ------------
    terra-vision__redis__data-volume:
        name: terra-vision__redis__data-volume
    

    # ------------ Postgres ------------
    terra-vision__postgres__volume:
        name: terra-vision__postgres__volume
    

    # ------------ Minio ------------
    terra-vision__minio__data-volume:
        name: terra-vision__minio__data-volume




    # <<<<<<<<<<<< DEV TOOLS volumes >>>>>>>>>>>>

    # ------------ Redis Insight ------------
    terra-vision__dev-tools__redis-insight__data-volume:
        name: terra-vision__dev-tools__redis-insight__data-volume