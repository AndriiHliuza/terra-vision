# <<< SERVICES >>>
services:

    # <<<<<<<<<<<< APPLICATION services >>>>>>>>>>>>

    # ------------ Mongo ------------ 
    terra-vision__mongo:
        image: mongo:8.2.4
        container_name: terra-vision__mongo
        restart: unless-stopped
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${TERRA_VISION__MONGO__ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${TERRA_VISION__MONGO__ROOT_PASSWORD}
        volumes:
            - terra-vision__mongo__db-volume:/data/db
            - terra-vision__mongo__configdb-volume:/data/configdb
            - ./mongo/initdb:/docker-entrypoint-initdb.d:ro
        networks:
            - terra-vision-network


    # ------------ Redis ------------
    terra-vision__redis:
        image: redis:8.2.4
        container_name: terra-vision__redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --requirepass ${TERRA_VISION__REDIS__PASSWORD}
        volumes:
            - terra-vision__redis__data-volume:/data
        networks:
            - terra-vision-network
    

    # ------------ Postgres ------------
    terra-vision__postgres:
        image: postgres:18.2
        container_name: terra-vision__postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${TERRA_VISION__POSTGRES__USER}
            POSTGRES_PASSWORD: ${TERRA_VISION__POSTGRES__PASSWORD}
            POSTGRES_DB: ${TERRA_VISION__POSTGRES__DB} # default db
        ports:
            - '5432:5432'
        volumes:
            - terra-vision__postgres__volume:/var/lib/postgresql
            - ./postgresql/initdb:/docker-entrypoint-initdb.d:ro
        networks:
            - terra-vision-network


    # ------------ Minio ------------
    terra-vision__minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: terra-vision__minio
        restart: unless-stopped
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${TERRA_VISION__MINIO__ROOT_USER}
            MINIO_ROOT_PASSWORD: ${TERRA_VISION__MINIO__ROOT_PASSWORD}
        volumes:
            - terra-vision__minio__data-volume:/data
        command: server /data --console-address ":9001"
        networks:
            - terra-vision-network


    # ------------ Vault (DEV) ------------
    terra-vision__vault:
        image: hashicorp/vault:1.21
        container_name: terra-vision__vault
        restart: unless-stopped
        ports:
            - "8200:8200"
        environment:
            VAULT_DEV_ROOT_TOKEN_ID: my-root-token
            VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
            VAULT_ADDR: http://127.0.0.1:8200
        cap_add:
            - IPC_LOCK
        command: vault server -dev
        volumes:
            - terra-vision__vault__file-volume:/vault/file
            - terra-vision__vault__logs-volume:/vault/logs
        healthcheck:
            test: ["CMD", "vault", "status"]
            interval: 5s
            timeout: 30s
            retries: 5
            start_period: 10s
        networks:
            - terra-vision-network
    
    terra-vision__vault-init:
        image: hashicorp/vault:1.21
        container_name: terra-vision__vault-init
        restart: no
        depends_on:
            terra-vision__vault:
                condition: service_healthy
        environment:
            VAULT_ADDR: http://terra-vision__vault:8200
            VAULT_TOKEN: ${VAULT_TOKEN}  
        volumes:
            - terra-vision__vault-init__file-volume:/vault/file
            - terra-vision__vault-init__logs-volume:/vault/logs
            - ./vault/scripts/vault-init.sh:/vault-init.sh
            - ./vault/secrets:/vault/secrets:ro
        entrypoint: ["sh", "/vault-init.sh"]
        networks:
            - terra-vision-network


    # ------------ Apache Kafka cluster ------------

    terra-vision__kafka-1:
        image: apache/kafka:4.2.0
        container_name: terra-vision__kafka-1
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            CLUSTER_ID: iDkx66yETIyPQ7ucmOLECA
            KAFKA_PROCESS_ROLES: broker, controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@terra-vision__kafka-1:9091,2@terra-vision__kafka-2:9091,3@terra-vision__kafka-3:9091
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://terra-vision__kafka-1:9090,EXTERNAL://localhost:9092'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_LOG_DIRS: '/var/lib/kafka/data'
        volumes:
            - terra-vision__kafka-1__data-volume:/var/lib/kafka/data
            - terra-vision__kafka-1__secrets-volume:/etc/kafka/secrets
            - terra-vision__kafka-1__config-volume:/mnt/shared/config
        networks:
            - terra-vision-network
    
    terra-vision__kafka-2:
        image: apache/kafka:4.2.0
        container_name: terra-vision__kafka-2
        ports:
            - "9093:9092"
        environment:
            KAFKA_NODE_ID: 2
            CLUSTER_ID: iDkx66yETIyPQ7ucmOLECA
            KAFKA_PROCESS_ROLES: broker, controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@terra-vision__kafka-1:9091,2@terra-vision__kafka-2:9091,3@terra-vision__kafka-3:9091
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://terra-vision__kafka-2:9090,EXTERNAL://localhost:9093'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_LOG_DIRS: '/var/lib/kafka/data'
        volumes:
            - terra-vision__kafka-2__data-volume:/var/lib/kafka/data
            - terra-vision__kafka-2__secrets-volume:/etc/kafka/secrets
            - terra-vision__kafka-2__config-volume:/mnt/shared/config
        networks:
            - terra-vision-network

    terra-vision__kafka-3:
        image: apache/kafka:4.2.0
        container_name: terra-vision__kafka-3
        ports:
            - "9094:9092"
        environment:
            KAFKA_NODE_ID: 3
            CLUSTER_ID: iDkx66yETIyPQ7ucmOLECA
            KAFKA_PROCESS_ROLES: broker, controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@terra-vision__kafka-1:9091,2@terra-vision__kafka-2:9091,3@terra-vision__kafka-3:9091
            KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
            KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
            KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092'
            KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://terra-vision__kafka-3:9090,EXTERNAL://localhost:9094'
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
            KAFKA_LOG_DIRS: '/var/lib/kafka/data'
        volumes:
            - terra-vision__kafka-3__data-volume:/var/lib/kafka/data
            - terra-vision__kafka-3__secrets-volume:/etc/kafka/secrets
            - terra-vision__kafka-3__config-volume:/mnt/shared/config
        networks:
            - terra-vision-network

    # <<<<<<<<<<<< DEV TOOLS services >>>>>>>>>>>>

    terra-vision__dev-tools__pgadmin:
        image: dpage/pgadmin4:9.13.0
        container_name: terra-vision__dev-tools__pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${TERRA_VISION__PGADMIN__DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${TERRA_VISION__PGADMIN__DEFAULT_PASSWORD}
        ports:
            - "5050:80"
        volumes:
            - terra-vision__dev-tools__pgadmin__pgadmin-volume:/var/lib/pgadmin
        networks:
            - terra-vision-network


    # ------------ Mongo Express ------------
    terra-vision__dev-tools__mongo-express:
        image: mongo-express:1.0.2
        container_name: terra-vision__dev-tools__mongo-express
        restart: unless-stopped
        ports:
            - 8081:8081
        environment:
            ME_CONFIG_MONGODB_SERVER: terra-vision__mongo
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${TERRA_VISION__MONGO__ROOT_USERNAME}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${TERRA_VISION__MONGO__ROOT_PASSWORD}
            ME_CONFIG_BASICAUTH_ENABLED: true
            ME_CONFIG_BASICAUTH_USERNAME: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
            ME_CONFIG_BASICAUTH_PASSWORD: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
        networks:
            - terra-vision-network
  

    # ------------ Redis Insight ------------
    terra-vision__dev-tools__redis-insight:
        image: redis/redisinsight:3.0
        container_name: terra-vision__dev-tools__redis-insight
        restart: unless-stopped
        ports:
            - "5540:5540"
        volumes:
            - terra-vision__dev-tools__redis-insight__data-volume:/data
        networks:
            - terra-vision-network
    

    # ------------ MailPit ------------
    terra-vision__dev-tools__mailpit:
        image: axllent/mailpit:v1.29
        container_name: terra-vision__dev-tools__mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"  # SMTP port
            - "8025:8025"  # Web UI port
        networks:
            - terra-vision-network



# <<< NETWORKS >>>
networks:
    terra-vision-network:
        driver: bridge
        name: terra-vision-network



# <<< VOLUMES >>>
volumes:

    # <<<<<<<<<<<< APPLICATION volumes >>>>>>>>>>>>

    # ------------ Mongo ------------
    terra-vision__mongo__db-volume:
        name: terra-vision__mongo__db-volume


    terra-vision__mongo__configdb-volume:
        name: terra-vision__mongo__configdb-volume
    

    # ------------ Redis ------------
    terra-vision__redis__data-volume:
        name: terra-vision__redis__data-volume
    

    # ------------ Postgres ------------
    terra-vision__postgres__volume:
        name: terra-vision__postgres__volume
    

    # ------------ Minio ------------
    terra-vision__minio__data-volume:
        name: terra-vision__minio__data-volume


    # ------------ Vault ------------
    terra-vision__vault__file-volume:
        name: terra-vision__vault__file-volume
    
    terra-vision__vault__logs-volume:
        name: terra-vision__vault__logs-volume
    
    terra-vision__vault-init__file-volume:
        name: terra-vision__vault-init__file-volume
    
    terra-vision__vault-init__logs-volume:
        name: terra-vision__vault-init__logs-volume


    # ------------ Apache Kafka cluster ------------
    terra-vision__kafka-1__data-volume:
        name: terra-vision__kafka-1__data-volume
  
    terra-vision__kafka-1__secrets-volume:
        name: terra-vision__kafka-1__secrets-volume
    
    terra-vision__kafka-1__config-volume:
        name: terra-vision__kafka-1__config-volume
    

    terra-vision__kafka-2__data-volume:
        name: terra-vision__kafka-2__data-volume
  
    terra-vision__kafka-2__secrets-volume:
        name: terra-vision__kafka-2__secrets-volume
    
    terra-vision__kafka-2__config-volume:
        name: terra-vision__kafka-2__config-volume


    terra-vision__kafka-3__data-volume:
        name: terra-vision__kafka-3__data-volume
  
    terra-vision__kafka-3__secrets-volume:
        name: terra-vision__kafka-3__secrets-volume
    
    terra-vision__kafka-3__config-volume:
        name: terra-vision__kafka-3__config-volume




    # <<<<<<<<<<<< DEV TOOLS volumes >>>>>>>>>>>>

    # ------------ Redis Insight ------------
    terra-vision__dev-tools__pgadmin__pgadmin-volume:
        name: terra-vision__dev-tools__pgadmin__pgadmin-volume


    # ------------ Redis Insight ------------
    terra-vision__dev-tools__redis-insight__data-volume:
        name: terra-vision__dev-tools__redis-insight__data-volume