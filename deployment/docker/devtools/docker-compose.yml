services:
  terra-vision__dev-tools__mongo-express:
    image: mongo-express:1.0.2
    container_name: terra-vision__dev-tools__mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_SERVER: terra-vision__mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${TERRA_VISION__MONGO__ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${TERRA_VISION__MONGO__ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${TERRA_VISION__MONGO_EXPRESS__USERNAME}
    networks:
      - terra-vision-network
  
  terra-vision__dev-tools__redis-insight:
    image: redis/redisinsight:3.0
    container_name: terra-vision__dev-tools__redis-insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - terra-vision__dev-tools__redis-insight__data-volume:/data
    networks:
      - terra-vision-network

networks:
    terra-vision-network:
        external: true
        name: terra-vision-network
        
volumes:
    terra-vision__dev-tools__redis-insight__data-volume:
        name: terra-vision__dev-tools__redis-insight__data-volume