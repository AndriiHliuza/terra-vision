<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta
            name="description"
            content="Web page for account activation"
    />
    <title>ACCOUNT ACTIVATION</title>
</head>
    <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Hello, <span th:text="${username}">User</span>!</h2>
        <p>Thank you for registering. Please verify your account by clicking the button below:</p>
        <a th:href="${verificationLink}"
           style="display: inline-block;
                      background-color: #4CAF50;
                      color: white;
                      padding: 14px 20px;
                      text-decoration: none;
                      border-radius: 4px;
                      margin: 20px 0;">
            Verify Account
        </a>
        <p>This link expires in <strong th:text="${expirationHours}">15</strong> minutes.</p>
        <p>If you did not create an account, please ignore this email.</p>
        <p>Maybe someone accidentally entered your email address.</p>
    </body>
</html>
