spring:
  application:
    name: terra-vision-auth

  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/terra_vision_auth_db
    username: ${TERRA_VISION__POSTGRES__USER:postgres}
    password: ${TERRA_VISION__POSTGRES__PASSWORD:postgres}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${TERRA_VISION__REDIS__PASSWORD:adminpassword}

  flyway:
    baseline-on-migrate: true
    user: ${TERRA_VISION__POSTGRES__USER:postgres}
    password: ${TERRA_VISION__POSTGRES__PASSWORD:postgres}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:} # johnsmith@gmail.com
    password: ${EMAIL_APP_PASSWORD:} # application password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    com.project.terravision.auth: debug

server:
  port: 8082

application:

  mail:
    from: noreply@terra-vision.com
    verification-props:
      base-url: http://localhost:8080/api/auth/registration/confirm # Should be http://localhost:5173 instead of http://localhost:8080
      expiration: 15m

  security:
    allowed-origins:
      - http://localhost:5173
    jwt:
      issuer: terra-vision.com # Address or domain of the issuer like http://localhost:8080 or http://localhost:8082 or terra-vision.com. Can be just any string value like terra-vision.com
      access-token:
        expiration: 15m
      refresh-token:
        expiration: 7d
    key-pair:
      size: standard
      key-expiration: 10d