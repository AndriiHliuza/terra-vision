spring:
  application:
    name: terra-vision-auth

  profiles:
    active: local

  config:
    import: "vault://"

  cloud:
    vault:
      uri: http://localhost:8200
      authentication: token
      token: ${VAULT_TOKEN:my-root-token}
      kv:
        enabled: true
        backend: secret

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/terra_vision_auth_db
    username: ${TERRA_VISION__POSTGRES__USER}
    password: ${TERRA_VISION__POSTGRES__PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${TERRA_VISION__REDIS__PASSWORD}

  flyway:
    baseline-on-migrate: true
    user: ${TERRA_VISION__POSTGRES__USER}
    password: ${TERRA_VISION__POSTGRES__PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:} # johnsmith@gmail.com
    password: ${EMAIL_APP_PASSWORD:} # application password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    com.project.terravision.auth: debug

server:
  port: 8082

application:
  localization:
    supported-languages:
      - en
      - uk
    fallback-language: en

  mail:
    from: noreply@terra-vision.com
    subjects:
      registration-email-subject:
        en: "Verify your email address"
        uk: "Підтвердження електронної пошти"
      reset-password-email-subject:
        en: "Reset your password"
        uk: "Скидання пароля"
    fallback-email-subject: "Terra Vision Mail"
    verification-props:
      base-url: http://localhost:5173
      url-to-verify-email: /verify-email
      url-to-reset-password: /reset-password
      expiration: 15m

  security:
    allowed-origins:
      - http://localhost:5173
    jwt:
      issuer: terra-vision.com # Address or domain of the issuer like http://localhost:8080 or http://localhost:8082 or terra-vision.com. Can be just any string value like terra-vision.com
      access-token:
        expiration: 15m
      refresh-token:
        expiration: 7d
    key-pair:
      size: standard
      key-expiration: 10d
      print-key-pair: true