spring:
  application:
    name: terra-vision-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: ai-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/ai/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/api/auth/.well-known/jwks.json
