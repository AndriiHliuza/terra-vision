spring:
  application:
    name: terra-vision-gateway

  data:
    redis:
      host: localhost
      port: 6379
      password: ${TERRA_VISION__REDIS__PASSWORD:adminpassword}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-login
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/login
              filters:
                - name: AuthResponseToCookie
                  args:
                    accessTokenCookieName: accessToken
                    refreshTokenCookieName: refreshToken
                    refreshPath: /api/auth/refresh
                    sameSite: Strict
                    secure: false
                    accessTokenMaxAgeMinutes: 15
                    refreshTokenMaxAgeDays: 7
            - id: auth-service-refresh
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/refresh
              filters:
                - name: RefreshTokenCookieToRequestBodyConversion
                  args:
                    refreshTokenCookieName: refreshToken
                - name: AuthResponseToCookie
                  args:
                    accessTokenCookieName: accessToken
                    refreshTokenCookieName: refreshToken
                    refreshPath: /api/auth/refresh
                    sameSite: Strict
                    secure: false
                    accessTokenMaxAgeMinutes: 15
                    refreshTokenMaxAgeDays: 7
            - id: auth-service-logout
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/logout
              filters:
                - name: ClearAuthCookies
                  args:
                    accessTokenCookieName: accessToken
                    refreshTokenCookieName: refreshToken
                    refreshPath: /api/auth/refresh
                    sameSite: Strict
                    secure: false
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: ai-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/ai/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/api/auth/.well-known/jwks.json

application:
  gateway:
    filters:
      access-token-to-authorization-header-filter:
        accessTokenCookieName: accessToken